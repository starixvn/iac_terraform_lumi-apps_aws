.web:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "web/**/*"
    DIR_PATH: "web"

code-quality-web-terraform-lint:
  extends: [.web, .terraform_lint]

code-quality-web-terraform-fmt:
  extends: [.web, .terraform_fmt]

code-quality-web-yaml-lint:
  extends: [.web, .yaml_lint]

validate-syntax-web:
  extends: [.web, .validate_syntax]

validate-security-web:
  extends: [.web, .validate_security]

validate-security-checkov-web:
  extends: [.web, .validate_security_checkov]

build-web:
  rules:
    - if: $RULES_CHANGES_PATH != "web/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.web, .plan]
  needs: []

deploy-web:
  rules:
    - if: $RULES_CHANGES_PATH != "web/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.web, .apply]
  needs: ["build-web"]

destroy-web:
  rules:
    - if: $RULES_CHANGES_PATH != "web/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.web, .destroy]
  needs: ["build-web"]
