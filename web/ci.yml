.web:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "web/**/*"
    DIR_PATH: "web"

code-quality-app-terraform-lint:
  extends: [.app, .terraform_lint]

code-quality-app-terraform-fmt:
  extends: [.app, .terraform_fmt]

code-quality-app-yaml-lint:
  extends: [.app, .yaml_lint]

validate-syntax-app:
  extends: [.app, .validate_syntax]

validate-security-app:
  extends: [.app, .validate_security]

validate-security-checkov-app:
  extends: [.app, .validate_security_checkov]

web-deploy:
  rules:
    - if: $RULES_CHANGES_PATH != "web/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.web, .apply]
  needs: ["web-build"]

web-destroy:
  rules:
    - if: $RULES_CHANGES_PATH != "web/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.web, .destroy]
  needs: ["web-build"]
