.lb-internal:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "lb-internal/**/*"
    DIR_PATH: "lb-internal"

code-quality-lb-internal-terraform-lint:
  extends: [.lb-internal, .terraform_lint]

code-quality-lb-internal-terraform-fmt:
  extends: [.lb-internal, .terraform_fmt]

code-quality-lb-internal-yaml-lint:
  extends: [.lb-internal, .yaml_lint]

validate-syntax-lb-internal:
  extends: [.lb-internal, .validate_syntax]

validate-security-lb-internal:
  extends: [.lb-internal, .validate_security]

validate-security-checkov-lb-internal:
  extends: [.lb-internal, .validate_security_checkov]

build-lb-internal:
  rules:
    - if: $RULES_CHANGES_PATH != "lb-internal/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.lb-internal, .plan]
  needs: []

deploy-lb-internal:
  rules:
    - if: $RULES_CHANGES_PATH != "lb-internal/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.lb-internal, .apply]
  needs: ["build-lb-internal"]

destroy-lb-internal:
  rules:
    - if: $RULES_CHANGES_PATH != "lb-internal/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.lb-internal, .destroy]
  needs: ["build-lb-internal"]
