---
# Source: deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-apps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  replicas: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      containers:
      - name: sample-app
        image: nginxdemos/hello:latest
        imagePullPolicy: "IfNotPresent"
        ports:
        - containerPort: 80
---
# Source: service.yaml
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: sample-apps
spec:
  ports:
  - port: 80
    protocol: TCP
  type: ClusterIP
  selector:
    app: sample-app
---
# Source: ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app-ingress-rules
  namespace: sample-apps
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: nexops.staging.luminetsoft.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: sample-app
                port:
                  number: 80