apiVersion: v1
kind: Service
metadata:
  name: green-svc
spec:
  selector:
    app: green
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: blue-svc
spec:
  selector:
    app: blue
  type: ClusterIP    
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
